openapi: 3.0.3
info:
  title: Webhooks
  version: WEBHOOKS_VERSION
servers:
  - url: http://localhost:8080/
security:
  - Authorization: []
paths:
  x-speakeasy-errors:
    statusCodes:
      - default
  /configs:
    get:
      summary: Get many configs
      description: Sorted by updated date descending
      operationId: getManyConfigs
      tags:
        - webhooks.v1
      parameters:
        - name: id
          in: query
          description: Optional filter by Config ID
          required: false
          schema:
            type: string
            example: 4997257d-dfb6-445b-929c-cbe2ab182818
        - name: endpoint
          in: query
          description: Optional filter by endpoint URL
          required: false
          schema:
            type: string
            example: https://example.com
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigsResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - Authorization:
            - webhooks:read
    post:
      summary: Insert a new config
      description: >
        Insert a new webhooks config.


        The endpoint should be a valid https URL and be unique.


        The secret is the endpoint's verification secret.

        If not passed or empty, a secret is automatically generated.

        The format is a random string of bytes of size 24, base64 encoded.
        (larger size after encoding)


        All eventTypes are converted to lower-case when inserted.
      operationId: insertConfig
      tags:
        - webhooks.v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigUser'
        required: true
      responses:
        '200':
          description: Config created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - Authorization:
            - webhooks:write
  /configs/{id}:
    delete:
      summary: Delete one config
      description: Delete a webhooks config by ID.
      operationId: deleteConfig
      tags:
        - webhooks.v1
      parameters:
        - name: id
          in: path
          description: Config ID
          required: true
          schema:
            type: string
            example: 4997257d-dfb6-445b-929c-cbe2ab182818
      responses:
        '200':
          description: Config successfully deleted.
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - Authorization:
            - webhooks:write
    put:
      summary: Update one config
      description: Update a webhooks config by ID.
      operationId: updateConfig
      tags:
        - webhooks.v1
      parameters:
        - name: id
          in: path
          description: Config ID
          required: true
          schema:
            type: string
            example: 4997257d-dfb6-445b-929c-cbe2ab182818
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigUser'
        required: true
      responses:
        '200':
          description: Config successfully updated.
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - Authorization:
            - webhooks:write
  /configs/{id}/test:
    get:
      summary: Test one config
      description: Test a config by sending a webhook to its endpoint.
      operationId: testConfig
      tags:
        - webhooks.v1
      parameters:
        - name: id
          in: path
          description: Config ID
          required: true
          schema:
            type: string
            example: 4997257d-dfb6-445b-929c-cbe2ab182818
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - Authorization:
            - webhooks:read
  /configs/{id}/activate:
    put:
      summary: Activate one config
      description: >-
        Activate a webhooks config by ID, to start receiving webhooks to its
        endpoint.
      operationId: activateConfig
      tags:
        - webhooks.v1
      parameters:
        - name: id
          in: path
          description: Config ID
          required: true
          schema:
            type: string
            example: 4997257d-dfb6-445b-929c-cbe2ab182818
      responses:
        '200':
          description: Config successfully activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - Authorization:
            - webhooks:write
  /configs/{id}/deactivate:
    put:
      summary: Deactivate one config
      description: >-
        Deactivate a webhooks config by ID, to stop receiving webhooks to its
        endpoint.
      operationId: deactivateConfig
      tags:
        - webhooks.v1
      parameters:
        - name: id
          in: path
          description: Config ID
          required: true
          schema:
            type: string
            example: 4997257d-dfb6-445b-929c-cbe2ab182818
      responses:
        '200':
          description: Config successfully deactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - Authorization:
            - webhooks:write
  /configs/{id}/secret/change:
    put:
      summary: Change the signing secret of a config
      description: >
        Change the signing secret of the endpoint of a webhooks config.


        If not passed or empty, a secret is automatically generated.

        The format is a random string of bytes of size 24, base64 encoded.
        (larger size after encoding)
      operationId: changeConfigSecret
      tags:
        - webhooks.v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigChangeSecret'
      parameters:
        - name: id
          in: path
          description: Config ID
          required: true
          schema:
            type: string
            example: 4997257d-dfb6-445b-929c-cbe2ab182818
      responses:
        '200':
          description: Secret successfully changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - Authorization:
            - webhooks:write
  /deliveries:
    get:
      summary: List webhook deliveries
      operationId: getDeliveries
      tags: [webhooks.v1]
      parameters:
        - {name: configId, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/DeliveryStatus'}}
        - {name: createdAtFrom, in: query, schema: {type: string, format: date-time}}
        - {name: createdAtTo, in: query, schema: {type: string, format: date-time}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
      responses:
        '200':
          description: Paginated deliveries without payloads.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeliveriesResponse'}
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
      security:
        - Authorization: [webhooks:read]
  /deliveries/replay:
    post:
      summary: Replay a page of failed or pending deliveries
      operationId: replayDeliveries
      tags: [webhooks.v1]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, maxLength: 255}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReplayDeliveriesRequest'}
      responses:
        '200':
          description: Deliveries synchronously placed back in the durable queue.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReplayDeliveriesResponse'}
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
      security:
        - Authorization: [webhooks:write]
  /deliveries/{id}:
    get:
      summary: Get a webhook delivery
      operationId: getDelivery
      tags: [webhooks.v1]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Delivery detail including its payload.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeliveryResponse'}
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
      security:
        - Authorization: [webhooks:read]
  /deliveries/{id}/attempts:
    get:
      summary: List attempts for a webhook delivery
      operationId: getDeliveryAttempts
      tags: [webhooks.v1]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
      responses:
        '200':
          description: Paginated append-only attempt history.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeliveryAttemptsResponse'}
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
      security:
        - Authorization: [webhooks:read]
  /deliveries/{id}/replay:
    post:
      summary: Replay one failed or pending delivery
      operationId: replayDelivery
      tags: [webhooks.v1]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, maxLength: 255}
      responses:
        '200':
          description: Delivery synchronously placed back in the durable queue.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeliveryResponse'}
        default:
          description: Error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
      security:
        - Authorization: [webhooks:write]
components:
  securitySchemes:
    Authorization:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: '/oauth/token'
          refreshUrl: '/oauth/token'
          scopes: {}
  schemas:
    DeliveryStatus:
      type: string
      enum: [pending, delivering, succeeded, failed, cancelled]
    Delivery:
      type: object
      required: [id, eventID, configID, eventType, status, attemptCount, replayGeneration, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        eventID: {type: string}
        idempotencyKey: {type: string}
        configID: {type: string, format: uuid}
        eventType: {type: string}
        payload: {type: string, description: Present only on delivery detail responses.}
        status: {$ref: '#/components/schemas/DeliveryStatus'}
        attemptCount: {type: integer}
        replayGeneration: {type: integer}
        cycleStartedAt: {type: string, format: date-time}
        nextAttemptAt: {type: string, format: date-time}
        claimedAt: {type: string, format: date-time}
        lastAttemptAt: {type: string, format: date-time}
        lastStatusCode: {type: integer}
        lastError: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    DeliveryAttempt:
      type: object
      required: [id, deliveryID, attemptNumber, replayGeneration, endpoint, outcome, statusCode, createdAt]
      properties:
        id: {type: string, format: uuid}
        deliveryID: {type: string, format: uuid}
        attemptNumber: {type: integer}
        replayGeneration: {type: integer}
        endpoint: {type: string, format: uri}
        outcome:
          type: string
          enum: [succeeded, retryable_failure, permanent_failure]
        statusCode: {type: integer}
        error: {type: string}
        durationMillis: {type: integer, format: int64}
        responseExcerpt: {type: string}
        createdAt: {type: string, format: date-time}
    DeliveryResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/Delivery'}
    DeliveriesResponse:
      type: object
      required: [cursor]
      properties:
        cursor:
          type: object
          required: [hasMore, data]
          properties:
            pageSize: {type: integer}
            hasMore: {type: boolean}
            next: {type: string}
            data:
              type: array
              items: {$ref: '#/components/schemas/Delivery'}
    DeliveryAttemptsResponse:
      type: object
      required: [cursor]
      properties:
        cursor:
          type: object
          required: [hasMore, data]
          properties:
            pageSize: {type: integer}
            hasMore: {type: boolean}
            next: {type: string}
            data:
              type: array
              items: {$ref: '#/components/schemas/DeliveryAttempt'}
    ReplayDeliveriesRequest:
      type: object
      required: [createdAtFrom]
      properties:
        createdAtFrom: {type: string, format: date-time}
        createdAtTo: {type: string, format: date-time}
        statuses:
          type: array
          items:
            type: string
            enum: [failed, pending]
          default: [failed, pending]
        configIds:
          type: array
          items: {type: string, format: uuid}
        cursor: {type: string}
        pageSize: {type: integer, minimum: 1, maximum: 1000, default: 1000}
    ReplayDeliveriesResult:
      type: object
      required: [replayed, expedited, skipped, hasMore, createdAtTo]
      properties:
        replayed: {type: integer}
        expedited: {type: integer}
        skipped: {type: integer}
        hasMore: {type: boolean}
        nextCursor: {type: string}
        createdAtTo: {type: string, format: date-time}
    ReplayDeliveriesResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/ReplayDeliveriesResult'}
    ConfigUser:
      type: object
      required:
        - endpoint
        - eventTypes
      properties:
        name:
          type: string
          example: customer_payment
        endpoint:
          type: string
          example: https://example.com
        secret:
          type: string
          example: V0bivxRWveaoz08afqjU6Ko/jwO0Cb+3
        eventTypes:
          type: array
          items:
            type: string
            example: TYPE1
          example:
            - TYPE1
            - TYPE2
    ConfigsResponse:
      type: object
      required:
        - cursor
      properties:
        cursor:
          allOf:
            - $ref: '#/components/schemas/Cursor'
            - properties:
                data:
                  items:
                    $ref: '#/components/schemas/WebhooksConfig'
                  type: array
              type: object
              required:
                - data
    Cursor:
      type: object
      required:
        - hasMore
        - data
      properties:
        hasMore:
          type: boolean
          example: false
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhooksConfig'
    ConfigResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/WebhooksConfig'
    WebhooksConfig:
      type: object
      properties:
        id:
          type: string
          format: uuid
        endpoint:
          type: string
          example: https://example.com
        secret:
          type: string
          example: V0bivxRWveaoz08afqjU6Ko/jwO0Cb+3
        eventTypes:
          type: array
          items:
            type: string
            example: TYPE1
          example:
            - TYPE1
            - TYPE2
        active:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - endpoint
        - secret
        - eventTypes
        - active
        - createdAt
        - updatedAt
    ConfigChangeSecret:
      type: object
      properties:
        secret:
          type: string
          example: V0bivxRWveaoz08afqjU6Ko/jwO0Cb+3
      required:
        - secret
    AttemptResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Attempt'
    Attempt:
      type: object
      properties:
        id:
          type: string
          format: uuid
        webhookID:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        config:
          $ref: '#/components/schemas/WebhooksConfig'
        payload:
          type: string
          example: '{"data":"test"}'
        statusCode:
          type: integer
          example: 200
        retryAttempt:
          type: integer
          example: 1
        status:
          type: string
          example: success
        nextRetryAfter:
          type: string
          format: date-time
      required:
        - id
        - webhookID
        - createdAt
        - updatedAt
        - config
        - payload
        - statusCode
        - retryAttempt
        - status
    ErrorResponse:
      type: object
      required:
        - errorCode
        - errorMessage
      properties:
        errorCode:
          $ref: '#/components/schemas/ErrorsEnum'
        errorMessage:
          type: string
          example: '[VALIDATION] invalid ''cursor'' query param'
        details:
          type: string
          example: >-
            https://play.numscript.org/?payload=eyJlcnJvciI6ImFjY291bnQgaGFkIGluc3VmZmljaWVudCBmdW5kcyJ9
    ErrorsEnum:
      type: string
      enum:
        - INTERNAL
        - VALIDATION
        - NOT_FOUND
        - CONFLICT
      example: VALIDATION
